<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Consolidado | Sistema de Notas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">

  <header class="topbar">
    <h2>Sistema de Registro de Notas</h2>
    <a href="dashboard.html" class="btn-link">Volver</a>
  </header>

  <div class="dashboard-container">
    <aside class="sidebar">
      <h3>Menú</h3>
      <ul>
        <li><a href="dashboard.html" >Inicio</a></li>
        <li><a href="cursos.html">Cursos</a></li>
        <li><a href="estudiantes.html">Estudiantes</a></li>
        <li><a href="notas.html"class="active">Registro de notas</a></li>
        <li><a href="configuración.html">Configuración</a></li>
      </ul>
      <button onclick="logout()">Cerrar sesión</button>
    </aside>

    <main class="content">
      <h1>Registro Consolidado</h1>

      <section class="box">
        <select id="cursoSelect">
          <option value="">Seleccione un curso...</option>
        </select>
      </section>

      <section class="box table-container">
        <table id="tablaConsolidada">
          <thead>
            <tr>
              <th rowspan="2" class="col-header-identificador">Código</th>
              <th rowspan="2" class="col-header-identificador">Estudiante</th>
              <th colspan="4" class="head-unidad-1">UNIDAD I</th>
              <th colspan="4" class="head-unidad-2">UNIDAD II</th>
              <th rowspan="2" class="head-final">PROM. FINAL</th>
            </tr>
            <tr>
              <th id="th-u1-cc">CC <button class="btn-add" onclick="agregarColumna('u1-cc')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-cc')">-</button></th>
              <th id="th-u1-cp">CP <button class="btn-add" onclick="agregarColumna('u1-cp')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-cp')">-</button></th>
              <th id="th-u1-ca">CA <button class="btn-add" onclick="agregarColumna('u1-ca')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-ca')">-</button></th>
              <th style="background-color: #ecf0f1; color: #333;">Prom U1</th>
              <th id="th-u2-cc">CC <button class="btn-add" onclick="agregarColumna('u2-cc')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-cc')">-</button></th>
              <th id="th-u2-cp">CP <button class="btn-add" onclick="agregarColumna('u2-cp')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-cp')">-</button></th>
              <th id="th-u2-ca">CA <button class="btn-add" onclick="agregarColumna('u2-ca')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-ca')">-</button></th>
              <th style="background-color: #ecf0f1; color: #333;">Prom U2</th>
            </tr>
          </thead>
          <tbody id="cuerpoNotas"></tbody>
        </table>

        <button class="btn-primary" style="margin-top: 20px; width: 100%;" onclick="guardarNotas()">
          Guardar Registro Consolidado
        </button>
      </section>
    </main>
  </div>

  <script type="module" src="js/notas.js"></script>
</body>
</html>
