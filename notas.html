<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Consolidado | Sistema de Notas</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="dashboard-body">

  <header class="topbar">
    <h2>Sistema de Registro de Notas</h2>
    <a href="dashboard.html" class="btn-link">Volver</a>
  </header>

  <div class="dashboard-container">
    <aside class="sidebar">
      <h3>Menú</h3>
      <ul>
        <li><a href="dashboard.html" >Inicio</a></li>
        <li><a href="cursos.html">Cursos</a></li>
        <li><a href="estudiantes.html">Estudiantes</a></li>
        <li><a href="notas.html" class="active">Registro de notas</a></li>
        <li><a href="configuración.html">Configuración</a></li>
      </ul>
      <button onclick="logout()">Cerrar sesión</button>
    </aside>

    <main class="content">
      <h1>Registro Consolidado</h1>

      <section class="box">
        <select id="cursoSelect">
          <option value="">Seleccione un curso...</option>
        </select>
      </section>

      <section class="box table-container">
        <table id="tablaConsolidada">
          <thead>
            <tr>
              <th rowspan="2" class="col-header-identificador">Código</th>
              <th rowspan="2" class="col-header-identificador">Estudiante</th>
              <th colspan="4" class="head-unidad-1">UNIDAD I</th>
              <th colspan="4" class="head-unidad-2">UNIDAD II</th>
              <th rowspan="2" class="head-final">PROM. FINAL</th>
            </tr>
            <tr>
              <th id="th-u1-cc">CC <button class="btn-add" onclick="agregarColumna('u1-cc')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-cc')">-</button></th>
              <th id="th-u1-cp">CP <button class="btn-add" onclick="agregarColumna('u1-cp')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-cp')">-</button></th>
              <th id="th-u1-ca">CA <button class="btn-add" onclick="agregarColumna('u1-ca')">+</button> <button class="btn-remove" onclick="quitarColumna('u1-ca')">-</button></th>
              <th style="background-color: #ecf0f1; color: #333;">Prom U1</th>
              <th id="th-u2-cc">CC <button class="btn-add" onclick="agregarColumna('u2-cc')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-cc')">-</button></th>
              <th id="th-u2-cp">CP <button class="btn-add" onclick="agregarColumna('u2-cp')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-cp')">-</button></th>
              <th id="th-u2-ca">CA <button class="btn-add" onclick="agregarColumna('u2-ca')">+</button> <button class="btn-remove" onclick="quitarColumna('u2-ca')">-</button></th>
              <th style="background-color: #ecf0f1; color: #333;">Prom U2</th>
            </tr>
          </thead>
          <tbody id="cuerpoNotas"></tbody>
        </table>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-primary" style="flex: 1;" onclick="guardarNotas()">
              Guardar Registro Consolidado
            </button>
            <button type="button" style="flex: 1; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;" onclick="exportarExcel()">
              Descargar Excel
            </button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/notas.js"></script>

  <script>
    /**
     * Esta función extrae los datos DIRECTAMENTE de la pantalla actual,
     * así que si tienes 3 columnas en CC, las 3 se irán al Excel.
     */
    function exportarExcel() {
      const tabla = document.getElementById("tablaConsolidada");
      const cursoSelect = document.getElementById("cursoSelect");
      const nombreCurso = cursoSelect.options[cursoSelect.selectedIndex]?.text || "Registro";

      // 1. Crear una matriz para guardar los datos
      const datosParaExcel = [];

      // 2. Obtener las filas de la tabla
      const filas = tabla.querySelectorAll("tr");

      filas.forEach((fila, indexFila) => {
        const filaData = [];
        // Buscamos tanto th como td
        const celdas = fila.querySelectorAll("th, td");

        celdas.forEach((celda) => {
          // Si la celda tiene botones (como los de + y -), los ignoramos
          const botones = celda.querySelectorAll("button");
          
          // Si la celda tiene inputs (tus notas de CC, CP, CA)
          const inputs = celda.querySelectorAll("input");
          
          if (inputs.length > 0) {
            // Si hay varios inputs (como tus 3 columnas de CC), 
            // los ponemos cada uno en una celda de Excel diferente
            inputs.forEach(input => {
                filaData.push(input.value || "0");
            });
          } else {
            // Si es texto normal (Nombre, Código, Promedio o Títulos)
            // Limpiamos el texto de los botones (+/-) para que el encabezado quede limpio
            let textoLimpio = celda.innerText.split('+')[0].split('-')[0].trim();
            filaData.push(textoLimpio);
          }
        });
        datosParaExcel.push(filaData);
      });

      // 3. Convertir la matriz a una hoja de Excel
      const ws = XLSX.utils.aoa_to_sheet(datosParaExcel);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Notas Consolidadas");

      // 4. Descargar archivo
      XLSX.writeFile(wb, `Registro_Notas_${nombreCurso}.xlsx`);
    }
  </script>
</body>
</html>
